<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Öğrenci Ekranı | Staj Evrak Doğrulama ve Yönetim Sistemi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap&subset=latin-ext" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <strong>Staj Evrak Doğrulama ve Yönetim Sistemi</strong>
    <div class="who">
      <span id="user-name"></span>
      <button type="button" class="btn" id="logout-btn">Çıkış yap</button>
    </div>
  </header>

  <main class="container">
    <section class="panel" aria-labelledby="list-title">
      <div class="panel-head">
        <h2 id="list-title">Evraklarım</h2>
        <button type="button" class="btn btn-solid" id="upload-btn">Evrak Yükle</button>
      </div>
      <ul id="doc-list" class="app-list"></ul>
      <p id="empty" class="empty" hidden>Henüz evrak yüklemedin. "Evrak Yükle" ile Ek-16 belgeni ekle.</p>
    </section>
  </main>

  <dialog id="upload-dialog" aria-labelledby="dlg-title">
    <form id="doc-form" class="dlg-body" novalidate>
      <h2 id="dlg-title">Evrak yükle</h2>
      <p class="muted">Ek-16 belgesindeki bilgileri elle gir. Sistem bunları belgeden okunan bilgilerle karşılaştırır.</p>
      <div id="fields" class="grid2"></div>
      <div class="field">
        <label for="file">Ek-16 belgesi</label>
        <input id="file" type="file" accept=".doc,.docx,.pdf,.jpeg,.jpg,.png">
        <p class="hint">Kabul edilen formatlar: .doc, .docx, .pdf, .jpeg, .png</p>
      </div>
      <p id="form-message" class="message" role="alert" hidden></p>
      <div class="dlg-actions">
        <button type="button" class="btn" id="cancel-btn">Vazgeç</button>
        <button type="submit" class="btn btn-solid" id="submit-btn">Yükle</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
  <script src="student.js"></script>
</body>
</html>
